<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Faculty Availability</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Shared Faculty layout -->

  <!-- Availability page styles -->
  <link rel="stylesheet" href="css/faculty-availability.css">
</head>

<body data-active-page="availability">

  <!-- ==========================
       TOP NAVIGATION BAR
  =========================== -->
  <header class="faculty-navbar">
    <div class="faculty-navbar-left">
      <button type="button" class="faculty-nav-icon-button faculty-hamburger-button" id="facultyHamburgerButton" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <img src="images/whitepf.png" alt="Prof Consult Logo" class="faculty-navbar-logo">
    </div>

    <div class="faculty-navbar-right">

      <button type="button" class="faculty-nav-icon-button faculty-notification-bell-button" id="facultyNotificationBellButton" aria-label="Notifications">
        <img src="images/bell.png" alt="">
      </button>

      <button type="button" class="faculty-nav-icon-button faculty-quick-action-button" id="facultyQuickActionButton" aria-haspopup="true" aria-expanded="false">
        <img src="images/actionbutton.png" alt="">
      </button>

      <div class="faculty-quick-action-panel" id="facultyQuickActionPanel" hidden>

        <div class="faculty-quick-action-header">
          <span class="faculty-quick-action-icon-wrap">
            <img src="images/redactionbutton.png" alt="">
          </span>

          <p class="format-text faculty-quick-action-title">
            Quick Action
          </p>
        </div>

        <div class="faculty-quick-action-actions">
          <button type="button" class="faculty-quick-action-item-button faculty-checkin-button" id="facultyCheckInButton">
            Check In
          </button>

          <button type="button" class="faculty-quick-action-item-button faculty-checkout-button" id="facultyCheckOutButton">
            Check Out
          </button>
        </div>

      </div>

    </div>
  </header>

  <!-- ==========================
       SIDEBAR
  =========================== -->

  <div class="faculty-sidebar-overlay" id="facultySidebarOverlay" hidden></div>

  <aside class="faculty-sidebar" id="facultySidebar">

    <div class="faculty-sidebar-header">

      <img src="images/whitepf.png" alt="Prof Consult Logo" class="faculty-sidebar-logo">

      <button type="button" class="faculty-sidebar-close" id="facultySidebarClose">
        &times;
      </button>

    </div>

    <nav class="faculty-sidebar-nav">
      <a href="faculty-dashboard.html" class="faculty-sidebar-link" data-page="dashboard">Dashboard</a>
      <a href="faculty-consultation-requests.html" class="faculty-sidebar-link" data-page="consultation-requests">Consultation Requests</a>
      <a href="faculty-availability.html" class="faculty-sidebar-link" data-page="availability">Availability</a>
      <a href="faculty-notifications.html" class="faculty-sidebar-link" data-page="notifications">Notifications</a>
      <a href="faculty-profile.html" class="faculty-sidebar-link" data-page="profile">Profile</a>
      <a href="faculty-settings.html" class="faculty-sidebar-link" data-page="settings">Settings</a>
      <a href="faculty-login.html" class="faculty-sidebar-link" data-page="logout">Logout</a>
    </nav>

  </aside>

  <!-- ==========================
       BACKGROUND
  =========================== -->

  <div class="faculty-page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="faculty-page-background-image">
    <div class="faculty-page-background-overlay"></div>
  </div>

  <!-- ==========================
       AVAILABILITY CONTENT
  =========================== -->

  <main class="faculty-main-content">

    <!-- Build the Availability page here -->
<!-- =========================================================
     FACULTY AVAILABILITY -- MAIN CONTENT
     Paste this inside <main class="faculty-main-content">...</main>
     on faculty-availability.html, alongside the shared navbar/
     sidebar/background shell. Do not duplicate the shell here,
     and do not touch faculty-shared.css/faculty-shared.js.
========================================================= -->

<<!-- =========================================================
     FACULTY AVAILABILITY -- MAIN CONTENT
     Paste this inside <main class="faculty-main-content">...</main>
     on faculty-availability.html, alongside the shared navbar/
     sidebar/background shell. Do not duplicate the shell here,
     and do not touch faculty-shared.css/faculty-shared.js.
========================================================= -->

<div class="availability-page-heading">
  <h1 class="availability-title">Availability</h1>
</div>

<div class="availability-grid">

  <!-- LEFT: current status pill + Change Status dropdown -->
  <div class="availability-column-left">
    <div class="faculty-status-row">
      <div class="faculty-status-pill">
        <span class="status-dot status-consultation" id="availabilityStatusDot" aria-hidden="true"></span>
        <span id="availabilityStatusLabel">Consultation</span>
      </div>

      <div class="faculty-change-status-wrap">
        <button type="button" class="faculty-change-status-button" id="changeStatusButton" aria-haspopup="true" aria-expanded="false">
          Change Status
        </button>

        <!-- Status selection popup -- anchored directly below
             the Change Status button, not the status pill -->
        <div class="faculty-status-panel" id="statusPanel" hidden>
          <button type="button" class="faculty-status-option" data-status="available" data-label="Available">
            <span class="faculty-status-radio" aria-hidden="true"></span> Available
          </button>
          <button type="button" class="faculty-status-option" data-status="teaching" data-label="In Class">
            <span class="faculty-status-radio" aria-hidden="true"></span> In Class
          </button>
          <button type="button" class="faculty-status-option" data-status="meeting" data-label="Meeting">
            <span class="faculty-status-radio" aria-hidden="true"></span> Meeting
          </button>
          <button type="button" class="faculty-status-option is-selected" data-status="consultation" data-label="Consultation">
            <span class="faculty-status-radio" aria-hidden="true"></span> Consultation
          </button>
          <button type="button" class="faculty-status-option" data-status="onleave" data-label="On Leave">
            <span class="faculty-status-radio" aria-hidden="true"></span> On Leave
          </button>
          <button type="button" class="faculty-status-option" data-status="offline" data-label="Offline">
            <span class="faculty-status-radio" aria-hidden="true"></span> Offline
          </button>
          <button type="button" class="faculty-status-save-button" id="saveStatusButton">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: weekly Available Hours schedule -->
  <section class="faculty-card availability-hours-card">
    <h2 class="availability-hours-title">Available Hours:</h2>

    <div class="availability-hours-list" id="availabilityHoursList">
      <!-- Day rows (with each day's own independent time dropdown)
           are rendered by faculty-availability.js from the
           AVAILABLE_HOURS data array, so this can later be
           connected to real faculty account data without
           touching this markup. -->
    </div>

    <div class="availability-hours-actions">
      <button type="button" class="availability-edit-button" id="editHoursButton">Edit</button>
      <button type="button" class="availability-save-button" id="saveHoursButton">Save</button>
    </div>
  </section>

</div>
  </main>

  <script src="js/faculty-shared.js"></script>
  <script src="js/faculty-availability.js?v=20260903-2345"></script>

</body>
</html>
