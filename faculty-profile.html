<!DOCTYPE html>
<!-- Faculty profile  -->
<html lang="en">
<head>
  <style id="profconsult-auth-lock">html{visibility:hidden!important}</style>
  <script src="js/auth-guard.js" data-auth-role="faculty"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Faculty Profile</title>
  <script src="js/dark-theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Shared Faculty layout  -->
  <link rel="stylesheet" href="css/faculty-shared.css">

  <link rel="stylesheet" href="css/faculty-profile.css">
    <link rel="stylesheet" href="css/dark-theme.css">

  <link rel="stylesheet" href="css/notification-popup.css">
  <script src="js/notification-popup.js"></script>
</head>

<body data-active-page="profile">

  <header class="faculty-navbar">
    <div class="faculty-navbar-left">
      <button type="button" class="faculty-nav-icon-button faculty-hamburger-button" id="facultyHamburgerButton" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <img src="images/whitepf.png" alt="Prof Consult Logo" class="faculty-navbar-logo">
    </div>

    <div class="faculty-navbar-right">

      <button type="button" class="faculty-nav-icon-button faculty-notification-bell-button" id="facultyNotificationBellButton" aria-label="Notifications">
        <img src="images/bell.png" alt="">
      </button>

      <button type="button" class="faculty-nav-icon-button faculty-quick-action-button" id="facultyQuickActionButton" aria-haspopup="true" aria-expanded="false">
        <img src="images/actionbutton.png" alt="">
      </button>

      <div class="faculty-quick-action-panel" id="facultyQuickActionPanel" hidden>

        <div class="faculty-quick-action-header">
          <span class="faculty-quick-action-icon-wrap">
            <img src="images/actionbutton.png" alt="">
          </span>

          <p class="format-text faculty-quick-action-title">
            Quick Action
          </p>
        </div>

        <div class="faculty-quick-action-actions">
          <button type="button" class="faculty-quick-action-item-button faculty-checkin-button" id="facultyCheckInButton">
            Check In
          </button>

          <button type="button" class="faculty-quick-action-item-button faculty-checkout-button" id="facultyCheckOutButton">
            Check Out
          </button>
        </div>

      </div>

    </div>
  </header>

  <div class="faculty-sidebar-overlay" id="facultySidebarOverlay" hidden></div>

  <aside class="faculty-sidebar" id="facultySidebar">

    <div class="faculty-sidebar-header">

      <img src="images/whitepf.png" alt="Prof Consult Logo" class="faculty-sidebar-logo">

      <button type="button" class="faculty-sidebar-close" id="facultySidebarClose">
        &times;
      </button>

    </div>

    <nav class="faculty-sidebar-nav">
      <a href="faculty-dashboard.html" class="faculty-sidebar-link" data-page="dashboard">Dashboard</a>
      <a href="faculty-consultation-requests.html" class="faculty-sidebar-link" data-page="consultation-requests">Consultation Requests</a>
      <a href="faculty-availability.html" class="faculty-sidebar-link" data-page="availability">Availability</a>
      <a href="faculty-notifications.html" class="faculty-sidebar-link" data-page="notifications">Notifications</a>
      <a href="faculty-profile.html" class="faculty-sidebar-link" data-page="profile">Profile</a>
      <a href="faculty-settings.html" class="faculty-sidebar-link" data-page="settings">Settings</a>
      <a href="login.html" class="faculty-sidebar-link" data-page="logout">Logout</a>
    </nav>

  </aside>

  <div class="faculty-page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="faculty-page-background-image">
    <div class="faculty-page-background-overlay"></div>
  </div>

  <main class="faculty-main-content">

<section class="faculty-card faculty-profile-card">

  <h1 class="faculty-profile-title">Faculty Profile</h1>

  <div class="faculty-profile-body">

    <div class="faculty-profile-left">
      <div class="faculty-profile-photo-wrap">
        <img
          src="images/default-profile.jpg"
          alt="Faculty profile photo"
          class="faculty-profile-photo"
          id="facultyProfilePhoto"
        >
        <button
          type="button"
          class="faculty-profile-photo-edit"
          id="facultyProfilePhotoEdit"
          aria-label="Change profile photo"
          title="Change profile photo"
        >
          &#9998;
        </button>
        <input
          type="file"
          id="facultyProfilePhotoInput"
          class="faculty-profile-photo-input"
          accept="image/jpeg,image/png,image/webp,image/gif"
        >
      </div>
    </div>

    <div class="faculty-profile-right">

      <div class="faculty-profile-info-card faculty-profile-view" id="facultyProfileView">
        <p class="faculty-profile-name" id="viewFacultyName">Juan Dela Cruz</p>
        <p class="faculty-profile-id" id="viewFacultyId">24-00001</p>

        <dl class="faculty-profile-details">
          <div class="faculty-profile-detail-row">
            <dt>Department:</dt>
            <dd id="viewFacultyProgram">Computer Engineering</dd>
          </div>
          <div class="faculty-profile-detail-row">
            <dt>Email:</dt>
            <dd id="viewFacultyEmail">juan.delacruz@cvsu.edu.ph</dd>
          </div>
          <div class="faculty-profile-detail-row">
            <dt>Phone Number:</dt>
            <dd id="viewFacultyPhone">+63 912-345-6789</dd>
          </div>
        </dl>
      </div>

      <form class="faculty-profile-info-card faculty-profile-edit" id="facultyProfileEdit" novalidate hidden>

        <div class="faculty-form-group">
          <div class="faculty-name-row">

            <div class="faculty-name-field">
              <label for="editFirstName">First Name</label>
              <input type="text" id="editFirstName" class="faculty-form-input" autocomplete="off">
            </div>

            <div class="faculty-name-field">
              <label for="editMiddleInitial">Middle Initial</label>
              <input type="text" id="editMiddleInitial" class="faculty-form-input" autocomplete="off" maxlength="1">
            </div>

            <div class="faculty-name-field">
              <label for="editLastName">Last Name</label>
              <input type="text" id="editLastName" class="faculty-form-input" autocomplete="off">
            </div>

            <div class="faculty-name-field">
              <label for="editFacultySuffix">Suffix</label>
              <select id="editFacultySuffix" class="faculty-form-input faculty-select">
                <option value="" selected>None</option>
                <option value="Sr.">Sr.</option>
                <option value="Jr.">Jr.</option>
                <option value="I">I</option>
                <option value="II">II</option>
                <option value="III">III</option>
              </select>
            </div>

          </div>
          <p class="faculty-form-error" id="nameError" hidden></p>
        </div>

        <div class="faculty-form-group">
          <label for="editFacultyId">Faculty ID</label>
          <input
            type="text"
            id="editFacultyId"
            class="faculty-form-input faculty-form-input-readonly"
            readonly
            aria-readonly="true"
            tabindex="-1"
          >
        </div>

        <div class="faculty-form-group">
          <label id="programDropdownLabel">Program</label>
          <div class="faculty-dropdown" id="programDropdown">
            <button
              type="button"
              class="faculty-dropdown-trigger"
              id="programDropdownTrigger"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-labelledby="programDropdownLabel programDropdownValue"
            >
              <span id="programDropdownValue">Computer Engineering</span>
              <span class="faculty-dropdown-caret" aria-hidden="true">&#9660;</span>
            </button>
            <ul class="faculty-dropdown-list" id="programDropdownList" role="listbox" hidden>
            </ul>
          </div>
        </div>

        <div class="faculty-form-group">
          <label for="editFacultyEmail">Email</label>
          <input type="email" id="editFacultyEmail" class="faculty-form-input" autocomplete="off">
          <p class="faculty-form-error" id="emailError" hidden></p>
        </div>

        <div class="faculty-form-group">
          <label for="editFacultyPhone">Phone Number</label>
          <div class="faculty-phone-input-wrap">
            <span class="faculty-phone-prefix">+63</span>
            <input
              type="text"
              id="editFacultyPhone"
              class="faculty-form-input faculty-phone-input"
              inputmode="numeric"
              autocomplete="off"
              placeholder="912-345-6789"
              maxlength="12"
            >
          </div>
          <p class="faculty-form-error" id="phoneError" hidden></p>
        </div>

      </form>

    </div>

  </div>

  <button type="button" class="faculty-edit-profile-button" id="editProfileButton">
    Edit Profile
  </button>

  <div class="faculty-profile-footer">
    <p class="faculty-save-success" id="saveSuccessMessage" hidden>Profile updated successfully.</p>
  </div>

</section>
  </main>
  <script src="js/faculty-shared.js"></script>
  <script src="js/faculty-profile.js"></script>

</body>
</html>
