<!DOCTYPE html>
<!--= Verify account  -->
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prof Consult | Verify Your Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/verify-account.css"
  >

</head>


<body>

  <div
    class="page-background"
    aria-hidden="true"
  >

    <img
      src="images/coea.jpg"
      alt=""
      class="page-background-image"
    >

    <div class="page-background-overlay"></div>

  </div>

  <a
    href="create-student-account2.html"
    class="back-button"
    id="backButton"
    data-nav="back"
  >

    <span aria-hidden="true">
      &larr;
    </span>

    Back

  </a>

  <main class="registration-card">

    <h1 class="format-text registration-title">
      Verify Your Account
    </h1>

    <p
      class="verification-subtitle"
      id="verificationSubtitle"
    >
      Enter your email address to receive a verification code.
    </p>

    <form
      class="registration-form"
      id="verificationForm"
      novalidate
    >


      <div class="form-field">

        <div
          class="identifier-wrapper"
          id="emailInputWrapper"
        >

          <input
            type="email"
            id="emailInput"
            name="email"
            class="form-input"
            placeholder="Enter Email"
            autocomplete="email"
            maxlength="254"
          >

        </div>

        <div
          class="mobile-input-wrapper"
          id="mobileInputWrapper"
          hidden
        >

          <div class="country-code">
            +63
          </div>

          <input
            type="tel"
            id="mobileInput"
            name="mobile"
            class="mobile-input"
            placeholder="Enter Mobile Number"
            autocomplete="tel"
            inputmode="numeric"
            maxlength="10"
          >

        </div>

        <p
          id="verificationMessage"
          class="field-message field-message-error"
          hidden
          aria-live="polite"
        ></p>


      </div>

      <button
        type="submit"
        class="btn send-code-button"
        id="sendCodeButton"
      >
        Send Verification Code
      </button>


    </form>

    <p class="login-text reset-method-text">

      <span id="methodText">
        Enter
      </span>

      <a
        href="#"
        class="login-link"
        id="switchMethod"
      >
        Mobile Number
      </a>

      <span id="methodSuffix">
        instead
      </span>

    </p>


  </main>

  <script src="js/verify-account.js"></script>


</body>

</html>
