<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Create Student Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="create-student-account.css">
</head>
<body>

  <!-- =========================================================
       BACKGROUND
       Full-viewport background image, blurred, with a dark
       maroon (upper-left) -> bright orange (right) gradient
       overlay, matching the Student Login page
  ========================================================= -->
  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <!-- =========================================================
       BACK BUTTON -> student-login.html
  ========================================================= -->
  <a href="student-login.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>

  <!-- =========================================================
       MAIN CONTAINER: registration card
  ========================================================= -->
  <main class="registration-card">

    <h1 class="format-text registration-title">Create Student Account</h1>

    <form class="registration-form" id="createStudentAccountForm">

      <div class="form-field">
        <label for="studentNumber">Student Number</label>
        <input
          type="text"
          id="studentNumber"
          name="studentNumber"
          class="form-input"
          placeholder="00-00000"
          inputmode="numeric"
          autocomplete="off"
          maxlength="8"
          required
        >
      </div>

      <div class="form-field">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          class="form-input"
          placeholder="Surname, First Name, M.I"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-field">
        <label for="courseProgramTrigger">Course / Program</label>
        <div class="custom-select" id="courseProgramSelect" data-name="courseProgram">
          <button
            type="button"
            class="custom-select-trigger"
            id="courseProgramTrigger"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="custom-select-value" data-placeholder="Select Program">Select Program</span>
          </button>
          <ul class="custom-select-options" role="listbox" hidden>
            <!-- More programs can be added here later as additional <li> options -->
            <li role="option" data-value="computer-engineering">Computer Engineering</li>
          </ul>
          <input type="hidden" id="courseProgram" name="courseProgram" required>
        </div>
      </div>

      <div class="form-field">
        <label for="yearLevelTrigger">Year Level</label>
        <div class="custom-select" id="yearLevelSelect" data-name="yearLevel">
          <button
            type="button"
            class="custom-select-trigger"
            id="yearLevelTrigger"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="custom-select-value" data-placeholder="Year">Year</span>
          </button>
          <ul class="custom-select-options" role="listbox" hidden>
            <li role="option" data-value="1">1st Year</li>
            <li role="option" data-value="2">2nd Year</li>
            <li role="option" data-value="3">3rd Year</li>
            <li role="option" data-value="4">4th Year</li>
            <li role="option" data-value="5">5th Year</li>
          </ul>
          <input type="hidden" id="yearLevel" name="yearLevel" required>
        </div>
      </div>

      <button type="submit" class="btn next-button" id="nextButton">
        Next <span aria-hidden="true">&rarr;</span>
      </button>

    </form>

  </main>

  <script src="create-student-account.js"></script>

    <!-- ADD ONLY THIS -->
  <script>
  document.getElementById('createStudentAccountForm').addEventListener('submit', function(e) {
      e.preventDefault();
      localStorage.setItem('pf_student_num',    document.getElementById('studentNumber').value);
      localStorage.setItem('pf_student_name',   document.getElementById('fullName').value);
      localStorage.setItem('pf_student_course', document.getElementById('courseProgram').value);
      localStorage.setItem('pf_student_year',   document.getElementById('yearLevel').value);
      window.location.href = 'create-student-account2.html';
  });
  </script>
  
</body>
</html>
