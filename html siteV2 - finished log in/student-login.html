<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Student Login</title>
  <link rel="stylesheet" href="student-login.css">
</head>
<body>

  <!-- =========================================================
       BACKGROUND
       Full-screen background image with a dark red -> orange
       gradient overlay on top. Swap images/student-login-background.png
       for the real photo later.
  ========================================================= -->
  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <!-- =========================================================
       BACK BUTTON
       Returns to the Choose Account Type page
  ========================================================= -->
  <a href="choose-account.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>

  <!-- =========================================================
       PAGE LAYOUT
       Left: branding (Welcome to + logo)
       Right: login card
  ========================================================= -->
  <main class="login-page">

    <!-- Left section: branding -->
    <section class="branding-section">
      <p class="welcome-text">Welcome to</p>
      <img src="images/prof-consult-logo.png" alt="Prof Consult Logo" class="branding-logo">
    </section>

    <!-- Right section: login card -->
    <section class="login-card">

      <h1 class="format-text login-title">Student Login</h1>

      <form class="login-form" id="studentLoginForm" action="student-login.php" method="POST">

        <p class="field-message field-message-error" id="phpError" style="display:none; margin-bottom: 1rem;"></p>

        <label for="studentEmail" class="visually-hidden">Email or Username</label>
        <input
          type="text"
          id="studentEmail"
          name="email"
          class="login-input"
          placeholder="Email or Username"
          autocomplete="username"
          required
        >

        <label for="studentPassword" class="visually-hidden">Password</label>
        <input
          type="password"
          id="studentPassword"
          name="password"
          class="login-input"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <p class="field-message field-message-error" id="loginError" hidden>
          Incorrect email/username or password.
        </p>

        <div class="login-actions-row">
          <button type="submit" class="login-button" id="loginButton">Login</button>
          <a href="forgot-password.html?from=student" class="forgot-password-link" data-nav="forgot-password">
            Forgot Password?
          </a>
        </div>

        <label class="remember-me">
          <input type="checkbox" id="rememberMe" name="rememberMe" class="remember-me-checkbox">
          <span class="remember-me-circle" aria-hidden="true"></span>
          Remember Me
        </label>

      </form>

      <p class="create-account-text">
        Don't have an account?
        <a href="create-student-account.html" class="create-account-link" data-nav="create-account">
          Create Student Account
        </a>
      </p>

    </section>

  </main>

  <script src="student-login.js"></script>

    <script>
  (function() {
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      if (error) {
          const errDiv = document.getElementById('phpError');
          errDiv.textContent = decodeURIComponent(error.replace(/\+/g, ' '));
          errDiv.style.display = 'block';
          window.history.replaceState({}, document.title, window.location.pathname);
      }
      if (params.get('registered') === '1') {
          alert('Account created successfully! Please log in.');
      }
      if (params.get('reset') === '1') {
          alert('Password reset successful! Please log in.');
      }
  })();
  </script>
  
</body>
</html>
