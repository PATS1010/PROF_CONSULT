<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="forgot-password.css">
</head>
<body>

  <!-- =========================================================
       BACKGROUND -- same treatment as the Create Account pages
  ========================================================= -->
  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <!-- =========================================================
       BACK BUTTON
       Destination is set by forgot-password.js based on the
       ?from= query param (student-login.html or faculty-login.html)
  ========================================================= -->
  <a href="student-login.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>

  <!-- =========================================================
       MAIN CONTAINER
  ========================================================= -->
  <main class="registration-card">

    <h1 class="format-text registration-title">Forgot Password?</h1>

    <p class="forgot-password-subtitle">
      Don't worry! Enter your mobile number or email address to receive a verification code.
    </p>

    <form class="registration-form" id="forgotPasswordForm">

      <div class="form-field">
        <input
          type="text"
          id="identifier"
          name="identifier"
          class="form-input"
          placeholder="Email Address or mobile number"
          autocomplete="off"
          required
        >
      </div>

      <button type="submit" class="btn send-code-button" id="sendCodeButton">
        Send Verification Code
      </button>

    </form>

    <p class="login-text">
      Remember your password?
      <a href="student-login.html" class="login-link" id="loginLink" data-nav="login">Login</a>
    </p>

  </main>

  <script src="forgot-password.js"></script>
</body>
</html>
