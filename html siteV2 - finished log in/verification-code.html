<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Verify Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="verification-code.css">
</head>
<body>

  <!-- =========================================================
       BACKGROUND -- same treatment as Forgot Password / Create Account
  ========================================================= -->
  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <!-- =========================================================
       BACK BUTTON
       Returns to forgot-password.html, preserving the ?from=
       origin param (student/faculty) if one was present
  ========================================================= -->
  <a href="forgot-password.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>

  <!-- =========================================================
       MAIN CONTAINER
  ========================================================= -->
  <main class="registration-card">

    <h1 class="format-text registration-title">Verify Your Email or Mobile Number</h1>

    <p class="verify-subtitle">
      A 6-digit verification code has been sent to your email or mobile number.
    </p>

        <form class="registration-form" id="verificationForm"
          action="verify-code.php" method="POST">

      <input type="hidden" id="tokenField" name="token">
      <input type="hidden" id="combinedCode" name="code">

      <p class="field-message field-message-error" id="phpError" style="display:none; margin-bottom: 1rem;"></p>

      <label class="verification-label" id="verificationCodeLabel">Verification Code</label>

      <div class="verification-code-inputs" role="group" aria-labelledby="verificationCodeLabel">
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" data-index="0" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" data-index="1" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" data-index="2" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" data-index="3" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" data-index="4" autocomplete="off">
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" data-index="5" autocomplete="off">
      </div>

      <p class="resend-prompt">Didn't receive the code?</p>
      <button type="button" class="resend-button" id="resendButton">
        <span class="format-text resend-label">Resend Code</span>
        <span class="resend-timer-text">(<span id="resendTimer">01:00</span>)</span>
      </button>

      <button type="submit" class="btn verify-button" id="verifyButton">
        Verify
      </button>

      <p class="field-message field-message-error" id="verificationError" hidden>
        Incorrect verification code.
      </p>

    </form>

  </main>

  <script src="verification-code.js"></script>

    <script>
  (function() {
      const form = document.getElementById('verificationForm');
      const params = new URLSearchParams(window.location.search);

      // 1. Fill hidden token from URL
      document.getElementById('tokenField').value = params.get('token') || '';

      // 2. Before submit, combine 6 digits into hidden input
      form.addEventListener('submit', function(e) {
          const digits = document.querySelectorAll('.code-digit');
          let code = '';
          digits.forEach(function(d) { code += d.value; });
          document.getElementById('combinedCode').value = code;
      });

      // 3. Show PHP error if redirected back with ?error=...
      const error = params.get('error');
      if (error) {
          const errDiv = document.getElementById('phpError');
          errDiv.textContent = decodeURIComponent(error.replace(/\+/g, ' '));
          errDiv.style.display = 'block';
          window.history.replaceState({}, document.title, window.location.pathname);
      }
  })();
  </script>

</body>
</html>
