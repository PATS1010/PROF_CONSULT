<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Create New Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="create-new-password.css">
</head>
<body>

  <!-- =========================================================
       BACKGROUND -- same treatment as Forgot Password / Verification Code
  ========================================================= -->
  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <!-- =========================================================
       BACK BUTTON
       Returns to verification-code.html, preserving the ?from=
       origin param (student/faculty) if one was present
  ========================================================= -->
  <a href="verification-code.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>

  <!-- =========================================================
       MAIN CONTAINER
  ========================================================= -->
  <main class="registration-card">

    <h1 class="format-text registration-title">Create New Password</h1>

    <p class="create-password-subtitle">
      Your new password must be at least 8 characters long.
    </p>

    <form class="registration-form" id="createNewPasswordForm" action="reset-password.php" method="POST" novalidate>

       <!--  Hidden fields passed from verification page -->
      <input type="hidden" id="resetToken" name="token">
      <input type="hidden" id="userType" name="userType">
      <input type="hidden" id="userId" name="userId">

      <!--  PHP error message container -->
      <p class="field-message field-message-error" id="phpError" style="display:none; margin-bottom: 1rem;"></p>

      <!-- New Password -->
      <div class="form-field">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          name="newPassword"
          class="form-input password-input"
          autocomplete="new-password"
          required
        >
        <p class="field-message field-message-error" id="newPasswordError" hidden></p>
      </div>

      <!-- Confirm Password -->
      <div class="form-field">
        <label for="confirmNewPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmNewPassword"
          name="confirmNewPassword"
          class="form-input password-input"
          autocomplete="new-password"
          required
        >
        <p class="field-message field-message-error" id="confirmPasswordError" hidden>
          Password does not match.
        </p>
      </div>

      <!-- Show Password toggle -- controls both fields at once -->
      <label class="show-password-toggle">
        <input type="checkbox" id="showPasswordCheckbox" class="show-password-checkbox">
        <span class="show-password-circle" aria-hidden="true"></span>
        Show password
      </label>

      <!-- Password requirements hint -->
      <ul class="password-requirements">
        <li>&check; At least 8 characters</li>
        <li>&check; One uppercase letter</li>
        <li>&check; One number</li>
      </ul>

      <button type="submit" class="btn reset-password-button" id="resetPasswordButton">
        Reset Password
      </button>

    </form>

  </main>

  <script src="create-new-password.js"></script>

  <!-- JavaScript to fill hidden inputs and show PHP errors -->
  <script>
  (function() {
      const params = new URLSearchParams(window.location.search);

      // Fill hidden inputs from URL (passed by verify-code.php)
      document.getElementById('resetToken').value = params.get('token') || '';
      document.getElementById('userType').value = params.get('type') || '';
      document.getElementById('userId').value = params.get('id') || '';

      // Show error if redirected back with ?error=...
      const error = params.get('error');
      if (error) {
          const errDiv = document.getElementById('phpError');
          errDiv.textContent = decodeURIComponent(error.replace(/\+/g, ' '));
          errDiv.style.display = 'block';
          window.history.replaceState({}, document.title, window.location.pathname);
      }
  })();
  </script>

</body>
</html>
