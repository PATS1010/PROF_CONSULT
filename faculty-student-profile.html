<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Student Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Shared Faculty layout -->
  <link rel="stylesheet" href="css/faculty-shared.css">

  <!-- Faculty Student Profile page styles -->
  <link rel="stylesheet" href="css/faculty-student-profile.css">
</head>

<body>

  <!-- ==========================
       TOP NAVIGATION BAR (shared shell -- do not duplicate
       edits here; change faculty-shared.css/js instead)
  =========================== -->
  <header class="faculty-navbar">
    <div class="faculty-navbar-left">
      <button type="button" class="faculty-nav-icon-button faculty-hamburger-button" id="facultyHamburgerButton" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <img src="images/whitepf.png" alt="Prof Consult Logo" class="faculty-navbar-logo">
    </div>

    <div class="faculty-navbar-right">
      <button type="button" class="faculty-nav-icon-button faculty-notification-bell-button" id="facultyNotificationBellButton" aria-label="Notifications">
        <img src="images/bell.png" alt="">
      </button>

      <button type="button" class="faculty-nav-icon-button faculty-quick-action-button" id="facultyQuickActionButton" aria-haspopup="true" aria-expanded="false">
        <img src="images/actionbutton.png" alt="">
      </button>

      <div class="faculty-quick-action-panel" id="facultyQuickActionPanel" hidden>
        <div class="faculty-quick-action-header">
          <span class="faculty-quick-action-icon-wrap">
            <img src="images/redactionbutton.png" alt="">
          </span>
          <p class="format-text faculty-quick-action-title">Quick Action</p>
        </div>

        <div class="faculty-quick-action-actions">
          <button type="button" class="faculty-quick-action-item-button faculty-checkin-button" id="facultyCheckInButton">Check In</button>
          <button type="button" class="faculty-quick-action-item-button faculty-checkout-button" id="facultyCheckOutButton">Check Out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ==========================
       SIDEBAR (shared shell)
       No link here points to this page, so no data-page is
       marked active -- the faculty always arrives via a
       student's name, never via the sidebar.
  =========================== -->
  <div class="faculty-sidebar-overlay" id="facultySidebarOverlay" hidden></div>

  <aside class="faculty-sidebar" id="facultySidebar">
    <div class="faculty-sidebar-header">
      <img src="images/whitepf.png" alt="Prof Consult Logo" class="faculty-sidebar-logo">
      <button type="button" class="faculty-sidebar-close" id="facultySidebarClose" aria-label="Close menu">&times;</button>
    </div>

    <nav class="faculty-sidebar-nav">
      <a href="faculty-dashboard.html" class="faculty-sidebar-link" data-page="dashboard">Dashboard</a>
      <a href="faculty-consultation-requests.html" class="faculty-sidebar-link" data-page="consultation-requests">Consultation Requests</a>
      <a href="faculty-availability.html" class="faculty-sidebar-link" data-page="availability">Availability</a>
      <a href="faculty-notifications.html" class="faculty-sidebar-link" data-page="notifications">Notifications</a>
      <a href="faculty-profile.html" class="faculty-sidebar-link" data-page="profile">Profile</a>
      <a href="faculty-settings.html" class="faculty-sidebar-link" data-page="settings">Settings</a>
      <a href="faculty-login.html" class="faculty-sidebar-link" data-page="logout">Logout</a>
    </nav>
  </aside>

  <!-- ==========================
       BACKGROUND (shared shell)
  =========================== -->
  <div class="faculty-page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="faculty-page-background-image">
    <div class="faculty-page-background-overlay"></div>
  </div>

  <!-- ==========================
       FACULTY STUDENT PROFILE CONTENT
       Read-only view of the selected student's profile.
       Which student and where Back should return to both come
       from the URL (?studentId=...&from=...) -- see
       faculty-student-profile.js.
  =========================== -->
  <main class="faculty-main-content">

    <!-- Back button lives OUTSIDE the profile card, near the
         top-left of the content area. Its destination is set by
         JS based on the "from" URL parameter. -->
    <button type="button" class="student-profile-back-button" id="studentProfileBackButton">
      Back
    </button>

    <section class="student-profile-outer-card">

      <div class="student-profile-header">
        <img
          src="images/student-profile-photo.jpg"
          alt=""
          class="student-profile-photo"
          id="studentProfilePhoto"
        >
        <h1 class="student-profile-name" id="studentProfileName">Student Profile</h1>
      </div>

      <div class="student-profile-info-card" id="studentProfileInfoCard">

        <div class="student-profile-info-col">
          <div class="student-profile-field">
            <p class="student-profile-field-label">Student Number</p>
            <p class="student-profile-field-value" id="studentProfileNumber">&mdash;</p>
          </div>
          <div class="student-profile-field">
            <p class="student-profile-field-label">Course</p>
            <p class="student-profile-field-value" id="studentProfileCourse">&mdash;</p>
          </div>
          <div class="student-profile-field">
            <p class="student-profile-field-label">Year Level</p>
            <p class="student-profile-field-value" id="studentProfileYearLevel">&mdash;</p>
          </div>
        </div>

        <div class="student-profile-info-col">
          <div class="student-profile-field">
            <p class="student-profile-field-label">Section</p>
            <p class="student-profile-field-value" id="studentProfileSection">&mdash;</p>
          </div>
          <div class="student-profile-field">
            <p class="student-profile-field-label">Email</p>
            <p class="student-profile-field-value" id="studentProfileEmail">&mdash;</p>
          </div>
          <div class="student-profile-field">
            <p class="student-profile-field-label">Phone Number</p>
            <p class="student-profile-field-value" id="studentProfilePhone">&mdash;</p>
          </div>
        </div>

      </div>

      <!-- Shown instead of the info card above when the studentId
           in the URL doesn't match any known student. -->
      <p class="student-profile-not-found" id="studentProfileNotFound" hidden>
        This student's profile could not be found.
      </p>

    </section>

  </main>

  <!-- Shared Faculty layout behavior -->
  <script src="js/faculty-shared.js"></script>

  <!-- Page-specific behavior -->
  <script src="js/faculty-student-profile.js"></script>

</body>
</html>
