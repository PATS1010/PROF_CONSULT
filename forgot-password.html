<!DOCTYPE html>
<!-- SYSTEM NOTE: Defines the forgot password page structure used by the Prof Consult web app. -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prof Consult | Forgot Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/forgot-password.css">
</head>

<body>

  <!-- =========================================================
       BACKGROUND
  ========================================================= -->
  <div class="page-background" aria-hidden="true">

    <img
      src="images/coea.jpg"
      alt=""
      class="page-background-image"
    >

    <div class="page-background-overlay"></div>

  </div>


  <!-- =========================================================
       BACK BUTTON
       
       The JavaScript changes the destination depending on:
       ?from=student
       ?from=faculty
  ========================================================= -->
  <a
    href="student-login.html"
    class="back-button"
    id="backButton"
    data-nav="back"
  >
    <span aria-hidden="true">&larr;</span>
    Back
  </a>


  <!-- =========================================================
       MAIN CARD
  ========================================================= -->
  <main class="registration-card">

    <!-- PAGE TITLE -->
    <h1 class="format-text registration-title">
      Forgot Password?
    </h1>


    <!-- DESCRIPTION -->
    <p
      class="forgot-password-subtitle"
      id="forgotPasswordSubtitle"
    >
      Enter your email address to receive a verification code.
    </p>


    <!-- =======================================================
         FORM
    ======================================================= -->
    <form
      class="registration-form"
      id="forgotPasswordForm"
      novalidate
    >

      <div class="form-field">


        <!-- ===================================================
             EMAIL INPUT
             
             This is displayed by default.
        =================================================== -->
        <div
          class="identifier-wrapper"
          id="emailInputWrapper"
        >

          <input
            type="email"
            id="emailInput"
            name="email"
            class="form-input"
            placeholder="Enter Email"
            autocomplete="email"
            maxlength="254"
          >

        </div>


        <!-- ===================================================
             MOBILE INPUT
             
             Hidden by default.
             
             +63 is displayed separately and cannot be edited.
        =================================================== -->
        <div
          class="mobile-input-wrapper"
          id="mobileInputWrapper"
          hidden
        >

          <div class="country-code">
            +63
          </div>

          <input
            type="tel"
            id="mobileInput"
            name="mobile"
            class="mobile-input"
            placeholder="Enter Mobile Number"
            autocomplete="tel"
            inputmode="numeric"
            maxlength="10"
          >

        </div>


        <!-- ===================================================
             VALIDATION MESSAGE
        =================================================== -->
        <p
          id="forgotPasswordMessage"
          class="field-message field-message-error"
          hidden
          aria-live="polite"
        ></p>

      </div>


      <!-- =====================================================
           SEND VERIFICATION CODE BUTTON
      ===================================================== -->
      <button
        type="submit"
        class="btn send-code-button"
        id="sendCodeButton"
      >
        Send Verification Code
      </button>

    </form>


    <!-- =======================================================
         EMAIL / MOBILE TOGGLE
    ======================================================= -->
    <p class="login-text reset-method-text">

      <span id="methodText">
        Enter
      </span>

      <a
        href="#"
        class="login-link"
        id="switchMethod"
      >
        mobile number
      </a>

      <span id="methodSuffix">
        instead
      </span>

    </p>

  </main>


  <!-- JAVASCRIPT -->
  <script src="js/forgot-password.js"></script>

</body>

</html>
