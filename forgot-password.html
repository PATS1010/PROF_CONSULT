<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>

  <!-- =========================================================
       BACKGROUND -- same treatment as the Create Account pages
  ========================================================= -->
  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <!-- =========================================================
       BACK BUTTON
       Destination is set by forgot-password.js based on the
       ?from= query param (student-login.html or faculty-login.html)
  ========================================================= -->
  <a href="student-login.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>

  <!-- =========================================================
       MAIN CONTAINER
  ========================================================= -->
  <main class="registration-card">

    <h1 class="format-text registration-title">Forgot Password?</h1>

    <p class="forgot-password-subtitle">
      Don't worry! Enter your mobile number or email address to receive a verification code.
    </p>

    <form class="registration-form" id="forgotPasswordForm" novalidate>

      <div class="form-field">

        <!-- EMAIL INPUT (shown by default) -->
        <div class="identifier-wrapper" id="emailInputWrapper">
          <input
            type="email"
            id="emailInput"
            name="email"
            class="form-input"
            placeholder="Enter Email"
            autocomplete="email"
            maxlength="254"
          >
        </div>

        <!-- MOBILE INPUT (hidden by default) -->
        <div class="mobile-input-wrapper" id="mobileInputWrapper" hidden>
          <div class="country-code">+63</div>
          <input
            type="tel"
            id="mobileInput"
            name="mobile"
            class="mobile-input"
            placeholder="Enter Mobile Number"
            autocomplete="tel"
            inputmode="numeric"
            maxlength="10"
          >
        </div>

        <!-- VALIDATION MESSAGE -->
        <p id="forgotPasswordMessage" class="field-message field-message-error" hidden aria-live="polite"></p>

      </div>

      <button type="submit" class="btn send-code-button" id="sendCodeButton">
        Send Verification Code
      </button>

    </form>

    <!-- EMAIL / MOBILE TOGGLE -->
    <p class="login-text reset-method-text">
      <span id="methodText">Enter</span>
      <a href="#" class="login-link" id="switchMethod">Mobile Number</a>
      <span id="methodSuffix">instead</span>
    </p>

    <p class="login-text">
      Remember your password?
      <a href="student-login.html" class="login-link" id="loginLink" data-nav="login">Login</a>
    </p>

  </main>

  <script src="js/forgot-password.js"></script>
</body>
</html>
