<!DOCTYPE html>
<!-- Forgot password  -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/forgot-password.css">
  <script src="js/dark-theme.js" data-scope="public"></script>
<link rel="stylesheet" href="css/dark-theme.css">
</head>
<body>

  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <a href="login.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>

  <main class="registration-card">

    <h1 class="format-text registration-title">Forgot Password?</h1>

    <p class="forgot-password-subtitle">
      Don't worry! Enter your email address to receive a verification code.
    </p>

    <form class="registration-form" id="forgotPasswordForm" novalidate>

      <div class="form-field">

        <div class="identifier-wrapper" id="emailInputWrapper">
          <input
            type="email"
            id="emailInput"
            name="email"
            class="form-input"
            placeholder="Enter Email"
            autocomplete="email"
            maxlength="254"
          >
        </div>

        <p id="forgotPasswordMessage" class="field-message field-message-error" hidden aria-live="polite"></p>

      </div>

      <button type="submit" class="btn send-code-button" id="sendCodeButton">
        Send Verification Code
      </button>

    </form>

    <p class="login-text">
      Remember your password?
      <a href="login.html" class="login-link" id="loginLink" data-nav="login">Login</a>
    </p>

  </main>

  <script src="js/forgot-password.js"></script>
</body>
</html>
