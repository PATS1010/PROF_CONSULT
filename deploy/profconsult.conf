ServerName localhost

# Bound process count for small containers while allowing parallel requests.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 8
    ServerLimit 8
    MaxConnectionsPerChild 1000
</IfModule>
KeepAlive On
KeepAliveTimeout 2

<Directory /var/www/html>
    Options -Indexes
</Directory>

# These files are deployment/test sources, never public application resources.
<DirectoryMatch "^/var/www/html/(database|deploy|tests|vendor|paper-output)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|^(Dockerfile|composer\.(json|lock))$)">
    Require all denied
</FilesMatch>
