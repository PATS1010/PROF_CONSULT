<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Student Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/student-profile.css">
  <link rel="stylesheet" href="css/student-notification-toast.css">
  <script src="js/student-notification-toast.js"></script>
</head>
<body>

  <!-- =========================================================
       TOP NAVIGATION BAR -- identical to the Student Dashboard
  ========================================================= -->
  <header class="dashboard-navbar">
    <div class="navbar-left">
      <button type="button" class="nav-icon-button hamburger-button" id="hamburgerButton" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <img src="images/whitepf.png" alt="Prof Consult Logo" class="navbar-logo">
    </div>

    <div class="navbar-right">
      <!-- Notification bell -- navigates to notifications.html on click (see student-profile.js) -->
      <button type="button" class="nav-icon-button notification-bell-button" id="notificationBellButton" aria-label="Notifications">
        <img src="images/bell.png" alt="">
      </button>

      <!-- Quick Action trigger -->
      <button type="button" class="nav-icon-button notification-button" id="quickActionButton" aria-haspopup="true" aria-expanded="false" aria-label="Quick actions">
        <img src="images/actionbutton.png" alt="">
      </button>

      <!-- Quick Action popup: two actions, one shared "View Directory" button -->
      <div class="quick-action-panel" id="quickActionPanel" hidden>
        <div class="quick-action-header">
          <img src="images/redactionbutton.png" alt="" class="quick-action-icon">
          <div>
            <p class="format-text quick-action-title">Quick Action</p>
            <p class="quick-action-subtitle">What would you like to do?</p>
          </div>
        </div>

        <div class="quick-action-item">
          <div class="quick-action-item-text-block">
            <p class="quick-action-item-title">Find Faculty</p>
            <p class="quick-action-item-text">Search and view real-time faculty availability.</p>
          </div>
          <a href="faculty-directory.html" class="quick-action-button" data-nav="find-faculty">View Directory</a>
        </div>

        
      </div>
    </div>
  </header>

  <!-- =========================================================
       BURGER SIDEBAR -- identical to the Student Dashboard
  ========================================================= -->
  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="images/whitepf.png" alt="Prof Consult Logo" class="sidebar-logo">
      <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close menu">&times;</button>
    </div>

    <nav class="sidebar-nav">
      <a href="student-dashboard.html" class="sidebar-link">Dashboard</a>
      <a href="faculty-directory.html" class="sidebar-link">Faculty</a>
      <a href="my-requests.html" class="sidebar-link">My Requests</a>
      <a href="notifications.html" class="sidebar-link">Notifications</a>
      <a href="student-profile.html" class="sidebar-link is-active">Profile</a>
      <a href="settings.html" class="sidebar-link">Settings</a>
      <a href="student-login.html" class="sidebar-link">Logout</a>
    </nav>
  </aside>

  <!-- =========================================================
       BACKGROUND -- identical to the Student Dashboard
  ========================================================= -->
  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <!-- =========================================================
       MAIN PROFILE CARD
  ========================================================= -->
  <main class="profile-page">

    <div class="profile-card">

      <h1 class="format-text profile-title">Student Profile</h1>

      <!-- Student Information Card -->
      <div class="profile-info-card">

        <div class="profile-photo-wrapper">
          <img src="images/student-profile-photo.jpg" alt="John Dela Cruz" class="profile-photo" id="profilePhoto">
          <label class="profile-photo-edit" id="profilePhotoEdit" hidden>
            <input type="file" id="profilePhotoInput" accept="image/*" class="profile-photo-input">
            <span aria-hidden="true">&#9998;</span>
          </label>
        </div>

        <div class="profile-fields">

          <div class="profile-field-row profile-fullname-row">
            <!-- View mode: one connected full name (First + Middle Initial + Last) -->
            <div class="profile-fullname-view" id="profileFullNameView">
              <label>Full Name</label>
              <p class="profile-field profile-field-highlight" id="profileFullNameDisplay"></p>
            </div>

            <!-- Edit mode: First Name / Middle Initial / Last Name, each independently editable -->
            <div class="profile-fullname-edit" id="profileFullNameEdit" hidden>
              <div class="profile-fullname-part">
                <label for="profileFirstName">First Name</label>
                <input type="text" id="profileFirstName" class="profile-field" autocomplete="off">
              </div>
              <div class="profile-fullname-part">
                <label for="profileMiddleInitial">Middle Initial</label>
                <input type="text" id="profileMiddleInitial" class="profile-field" autocomplete="off">
              </div>
              <div class="profile-fullname-part">
                <label for="profileLastName">Last Name</label>
                <input type="text" id="profileLastName" class="profile-field" autocomplete="off">
              </div>
            </div>
          </div>

          <div class="profile-field-row">
            <label for="profileStudentNumber">Student Number</label>
            <input type="text" id="profileStudentNumber" class="profile-field" value="24-00001" readonly disabled>
          </div>

          <div class="profile-field-row">
            <label for="profileCourse">Course</label>
            <select id="profileCourse" class="profile-field profile-select" disabled>
              <option value="computer-engineering" selected>BSCPE (Computer Engineering)</option>
            </select>
          </div>

          <div class="profile-field-row">
            <label for="profileYearLevel">Year Level</label>
            <select id="profileYearLevel" class="profile-field profile-select" disabled>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3" selected>3rd Year</option>
              <option value="4">4th Year</option>
              <option value="5">5th Year</option>
            </select>
          </div>

          <div class="profile-field-row">
            <label for="profileSection">Section</label>
            <select id="profileSection" class="profile-field profile-select" disabled>
              <option value="A" selected>A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </div>

          <div class="profile-field-row">
            <label for="profileEmail">Email</label>
            <input type="email" id="profileEmail" class="profile-field" value="john.delacruz@example.com" readonly>
            <p class="profile-field-error" id="emailError" hidden></p>
          </div>

          <div class="profile-field-row">
            <label for="profilePhone">Phone Number</label>
            <div class="profile-phone-group" id="profilePhoneGroup">
              <span class="profile-phone-prefix">+63</span>
              <input type="tel" id="profilePhone" class="profile-field profile-phone-input" value="912-345-6789" inputmode="numeric" readonly>
            </div>
            <p class="profile-field-error" id="phoneError" hidden></p>
          </div>

        </div>

      </div>

      <button type="button" class="btn edit-profile-button" id="editProfileButton">Edit Profile</button>

    </div>

  </main>

  <script src="js/notification-state.js"></script>
  <script src="js/student-profile.js"></script>
</body>
</html>
