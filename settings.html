<!DOCTYPE html>
<!-- Account settings  -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Account Settings</title>

  <!-- Shared theme: no defer, so the saved theme applies before first paint -->
  <script src="js/dark-theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/student-notification-toast.css">

  <!-- Shared dark theme (must come after the page CSS) -->
  <link rel="stylesheet" href="css/dark-theme.css">

  <script src="js/student-notification-toast.js"></script>
</head>
<body>

  <header class="dashboard-navbar">
    <div class="navbar-left">
      <button type="button" class="nav-icon-button hamburger-button" id="hamburgerButton" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
     <a href="student-dashboard.html" class="navbar-logo-link" aria-label="Go to Dashboard">
  <img src="images/whitepf.png" alt="Prof Consult Logo" class="navbar-logo">
</a>
    </div>

    <div class="navbar-right">
      <button type="button" class="nav-icon-button notification-bell-button" id="notificationBellButton" aria-label="Notifications">
        <img src="images/bell.png" alt="Notifications">
      </button>

      <button type="button" class="nav-icon-button notification-button" id="quickActionButton" aria-haspopup="true" aria-expanded="false" aria-label="Quick actions">
        <img src="images/actionbutton.png" alt="">
      </button>

      <div class="quick-action-panel" id="quickActionPanel" hidden>
        <div class="quick-action-header">
          <img src="images/redactionbutton.png" alt="" class="quick-action-icon">
          <div>
            <p class="format-text quick-action-title">Quick Action</p>
            <p class="quick-action-subtitle">What would you like to do?</p>
          </div>
        </div>

        <div class="quick-action-item">
          <div class="quick-action-item-text-block">
            <p class="quick-action-item-title">Find Faculty</p>
            <p class="quick-action-item-text">Search and view real-time faculty availability.</p>
          </div>
          <a href="faculty-directory.html" class="quick-action-button" data-nav="find-faculty">View Directory</a>
        </div>

       
      </div>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
    <a href="student-dashboard.html" class="sidebar-logo-link" aria-label="Go to Dashboard">
  <img src="images/whitepf.png" alt="Prof Consult Logo" class="sidebar-logo">
</a>
      <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close menu">&times;</button>
    </div>

    <nav class="sidebar-nav">
      <a href="student-dashboard.html" class="sidebar-link">Dashboard</a>
      <a href="faculty-directory.html" class="sidebar-link">Faculty</a>
      <a href="my-requests.html" class="sidebar-link">My Requests</a>
      <a href="notifications.html" class="sidebar-link">Notifications</a>
      <a href="student-profile.html" class="sidebar-link">Profile</a>
      <a href="settings.html" class="sidebar-link is-active">Settings</a>
     <a href="login.html" class="sidebar-link" id="logoutLink">Logout</a>
    </nav>
  </aside>

  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <main class="settings-page">

    <div class="settings-outer-card">

      <h1 class="format-text settings-title">Account Settings</h1>

      <div class="settings-inner-card">

        <div class="settings-options">

          <label class="settings-option">
            <span class="settings-option-text">
              <span class="settings-option-title">Email Notifications</span>
              <span class="settings-option-description">Receive future system notifications at your registered email address.</span>
            </span>
            <span class="settings-checkbox">
              <input type="checkbox" id="emailNotificationsCheckbox" checked>
              <span class="settings-checkbox-box" aria-hidden="true"></span>
            </span>
          </label>

          <label class="settings-option">
            <span class="settings-option-text">
              <span class="settings-option-title">Push Notifications</span>
              <span class="settings-option-description">Show desktop/browser push notifications while you're logged in.</span>
            </span>
            <span class="settings-checkbox">
              <input type="checkbox" id="pushNotificationsCheckbox" checked>
              <span class="settings-checkbox-box" aria-hidden="true"></span>
            </span>
          </label>

          <label class="settings-option">
            <span class="settings-option-text">
              <span class="settings-option-title">Dark Mode</span>
              <span class="settings-option-description">Use a dark maroon theme across Prof Consult.</span>
            </span>
            <span class="settings-checkbox">
              <input type="checkbox" id="darkModeCheckbox">
              <span class="settings-checkbox-box" aria-hidden="true"></span>
            </span>
          </label>

        </div>

        <a href="change-password.html?from=student" class="format-text change-password-link" id="changePasswordLink">
          Change Password
        </a>

        <button type="button" class="settings-secondary-action-button" id="deleteAccountButton">
          Delete Account
        </button>

      </div>

    </div>

    <div class="save-button-wrapper">
      <button type="button" class="btn save-settings-button" id="saveSettingsButton">Save</button>
      <p class="save-success-popup" id="saveSuccessPopup" hidden>Saved successfully.</p>
    </div>

  </main>

  <script src="js/notification-state.js"></script>
  <script src="js/auth-guard.js" data-auth-role="student"></script>
  <script src="js/settings.js"></script>
</body>
</html>
