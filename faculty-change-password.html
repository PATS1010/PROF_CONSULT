<!-- SYSTEM NOTE: Defines the faculty change password page structure used by the Prof Consult web app. -->
<!-- =========================================================
     FACULTY CHANGE PASSWORD -- MAIN CONTENT
     Paste this inside <main class="faculty-main-content">...</main>
     on faculty-change-password.html, alongside the shared
     navbar/sidebar/background shell. Do not duplicate the
     shell here.
========================================================= -->

<section class="faculty-card faculty-change-password-card">

  <h1 class="format-text faculty-change-password-title">Change Password</h1>

  <form class="faculty-change-password-form" id="changePasswordForm" novalidate>

    <div class="faculty-form-group">
      <label for="currentPasswordInput">Current Password</label>
      <div class="faculty-password-input-wrap">
        <input type="password" id="currentPasswordInput" class="faculty-form-input" autocomplete="current-password">
        <button type="button" class="faculty-password-toggle" data-target="currentPasswordInput" aria-label="Show current password">Show</button>
      </div>
      <p class="faculty-form-error" id="currentPasswordError" hidden></p>
    </div>

    <div class="faculty-form-group">
      <label for="newPasswordInput">New Password</label>
      <div class="faculty-password-input-wrap">
        <input type="password" id="newPasswordInput" class="faculty-form-input" autocomplete="new-password">
        <button type="button" class="faculty-password-toggle" data-target="newPasswordInput" aria-label="Show new password">Show</button>
      </div>
      <p class="faculty-form-error" id="newPasswordError" hidden></p>
    </div>

    <div class="faculty-form-group">
      <label for="confirmPasswordInput">Confirm New Password</label>
      <div class="faculty-password-input-wrap">
        <input type="password" id="confirmPasswordInput" class="faculty-form-input" autocomplete="new-password">
        <button type="button" class="faculty-password-toggle" data-target="confirmPasswordInput" aria-label="Show confirm password">Show</button>
      </div>
      <p class="faculty-form-error" id="confirmPasswordError" hidden></p>
    </div>

    <div class="faculty-change-password-footer">
      <p class="faculty-save-success" id="passwordSaveSuccess" hidden>Password changed successfully.</p>
      <button type="submit" class="faculty-change-password-save-button" id="savePasswordButton">Save</button>
    </div>

  </form>

</section>
