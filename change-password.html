<!DOCTYPE html>
<!-- SYSTEM NOTE: Shared Change Password page used by BOTH Student and Faculty. -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prof Consult | Change Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/change-password.css">
  <link rel="stylesheet" href="css/student-notification-toast.css">
  <script src="js/student-notification-toast.js"></script>
</head>

<body>

  <!-- =========================================================
       BACKGROUND
  ========================================================= -->
  <div class="page-background" aria-hidden="true">

    <img
      src="images/coea.jpg"
      alt=""
      class="page-background-image"
    >

    <div class="page-background-overlay"></div>

  </div>


  <!-- =========================================================
       BACK BUTTON

       The JavaScript changes the destination depending on:
       ?from=student
       ?from=faculty
  ========================================================= -->
  <a
    href="settings.html?from=student"
    class="back-button"
    id="backButton"
    data-nav="back"
  >
    <span aria-hidden="true">&larr;</span>
    Back
  </a>


  <!-- =========================================================
       MAIN CARD
  ========================================================= -->
  <main class="registration-card">

    <!-- PAGE TITLE -->
    <h1 class="format-text registration-title">
      Change Password
    </h1>


    <!-- =======================================================
         FORM
    ======================================================= -->
    <form
      class="registration-form"
      id="changePasswordForm"
      novalidate
    >

      <!-- ===================================================
           CURRENT PASSWORD
      =================================================== -->
      <div class="form-field">

        <label
          class="field-label"
          for="currentPassword"
        >
          Current Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="currentPassword"
            name="currentPassword"
            class="form-input password-input"
            placeholder="Enter Current Password"
            autocomplete="off"
          >

          <button
            type="button"
            class="password-toggle"
            data-target="currentPassword"
            aria-label="Show password"
          >
            <span class="eye-icon" aria-hidden="true">&#128065;</span>
          </button>

        </div>


        <!-- FORGOT PASSWORD (origin is added by JS) -->
        <a
          href="forgot-password.html"
          class="forgot-password-link"
          id="forgotPasswordLink"
        >
          Forgot Password?
        </a>

      </div>


      <!-- ===================================================
           NEW PASSWORD
      =================================================== -->
      <div class="form-field">

        <label
          class="field-label"
          for="newPassword"
        >
          New Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="newPassword"
            name="newPassword"
            class="form-input password-input"
            placeholder="Enter New Password"
            autocomplete="new-password"
          >

          <button
            type="button"
            class="password-toggle"
            data-target="newPassword"
            aria-label="Show password"
          >
            <span class="eye-icon" aria-hidden="true">&#128065;</span>
          </button>

        </div>

      </div>


      <!-- ===================================================
           CONFIRM PASSWORD
      =================================================== -->
      <div class="form-field">

        <label
          class="field-label"
          for="confirmPassword"
        >
          Confirm Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input password-input"
            placeholder="Confirm New Password"
            autocomplete="new-password"
          >

          <button
            type="button"
            class="password-toggle"
            data-target="confirmPassword"
            aria-label="Show password"
          >
            <span class="eye-icon" aria-hidden="true">&#128065;</span>
          </button>

        </div>

      </div>


      <!-- ===================================================
           PASSWORD REQUIREMENTS
      =================================================== -->
      <ul class="password-requirements" id="passwordRequirements">

        <li data-rule="length">
          <span class="req-check" aria-hidden="true">&#10003;</span>
          At least 8 characters
        </li>

        <li data-rule="uppercase">
          <span class="req-check" aria-hidden="true">&#10003;</span>
          One uppercase letter
        </li>

        <li data-rule="number">
          <span class="req-check" aria-hidden="true">&#10003;</span>
          One number
        </li>

      </ul>


      <!-- ===================================================
           VALIDATION / SUCCESS MESSAGE
      =================================================== -->
      <p
        id="changePasswordMessage"
        class="field-message field-message-error"
        hidden
        aria-live="polite"
      ></p>


      <!-- ===================================================
           ACTIONS
      =================================================== -->
      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-save"
          id="saveButton"
        >
          Save
        </button>

        <button
          type="button"
          class="btn btn-cancel"
          id="cancelButton"
          data-nav="back"
        >
          Cancel
        </button>

      </div>

    </form>

  </main>


  <!-- JAVASCRIPT -->
  <script src="js/change-password.js"></script>

</body>

</html>
