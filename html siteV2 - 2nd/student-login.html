<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Student Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="student-login.css">
</head>
<body>

  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  <a href="choose-account.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>

  <main class="login-page">

    <section class="branding-section">
      <p class="welcome-text">Welcome to</p>
      <img
        src="images/prof-consult-logo.png"
        alt="Prof Consult Logo"
        class="branding-logo"
      >
    </section>

    <section class="login-card">
      <h1 class="format-text login-title">Student Login</h1>
      <p class="login-subtitle">Welcome, Student!</p>

      <form class="login-form" id="studentLoginForm">

        <label for="studentEmail" class="visually-hidden">
          Email or Username
        </label>
        <input
          type="text"
          id="studentEmail"
          name="email"
          class="login-input"
          placeholder="Email or Username"
          autocomplete="username"
          required
        >

        <label for="studentPassword" class="visually-hidden">
          Password
        </label>
        <input
          type="password"
          id="studentPassword"
          name="password"
          class="login-input"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <div class="login-actions-row">
          <button type="submit" class="login-button" id="loginButton">
            Login
          </button>

          <a
            href="forgot-password.html"
            class="forgot-password-link"
            data-nav="forgot-password"
          >
            Forgot Password?
          </a>
        </div>

        <label class="remember-me">
          <input
            type="checkbox"
            id="rememberMe"
            name="rememberMe"
            class="remember-me-checkbox"
          >
          <span class="remember-me-circle" aria-hidden="true"></span>
          Remember Me
        </label>

      </form>

      <p class="create-account-text">
        Don't have an account?
        <a
          href="create-student-account.html"
          class="create-account-link"
          data-nav="create-account"
        >
          Create Student Account
        </a>
      </p>
    </section>

  </main>

  <script src="student-login.js"></script>
</body>
</html>
