<!DOCTYPE html>
<!-- Create student account page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Create Student Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/create-student-account.css">
</head>
<body>

 
  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

 
  <a href="login.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>


  <main class="registration-card">

    <h1 class="format-text registration-title">Create Student Account</h1>

    <form class="registration-form" id="createStudentAccountForm">

      <div class="form-field">
        <label for="studentNumber">Student Number</label>
        <input
          type="text"
          id="studentNumber"
          name="studentNumber"
          class="form-input"
          placeholder="00-00000"
          inputmode="numeric"
          autocomplete="off"
          maxlength="8"
          required
        >
      </div>

      <div class="form-row form-row-name">

        <div class="form-field">
          <label for="firstName">First Name</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            class="form-input"
            autocomplete="given-name"
            required
          >
        </div>

        <div class="form-field">
          <label for="middleInitial">Middle Initial</label>
          <input
            type="text"
            id="middleInitial"
            name="middleInitial"
            class="form-input"
            autocomplete="additional-name"
            maxlength="1"
          >
        </div>

        <div class="form-field">
          <label for="lastName">Last Name</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            class="form-input"
            autocomplete="family-name"
            required
          >
        </div>

       
        <div class="form-field">
          <label for="suffixTrigger">Suffix</label>
          <div class="custom-select" id="suffixSelect" data-name="suffix">
            <button
              type="button"
              class="custom-select-trigger"
              id="suffixTrigger"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span class="custom-select-value" data-placeholder="Suffix">Suffix</span>
            </button>
            <ul class="custom-select-options" role="listbox" hidden>
              <li role="option" data-value="">None</li>
              <li role="option" data-value="Sr.">Sr.</li>
              <li role="option" data-value="Jr.">Jr.</li>
              <li role="option" data-value="I">I</li>
              <li role="option" data-value="II">II</li>
              <li role="option" data-value="III">III</li>
            </ul>
            <input type="hidden" id="suffix" name="suffix">
          </div>
        </div>

      </div>

      <div class="form-field">
        <label for="courseProgramTrigger">Course / Program</label>
        <div class="custom-select" id="courseProgramSelect" data-name="courseProgram">
          <button
            type="button"
            class="custom-select-trigger"
            id="courseProgramTrigger"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="custom-select-value" data-placeholder="Select Program">Select Program</span>
          </button>
          <ul class="custom-select-options" role="listbox" hidden>
         
            <li role="option" data-value="computer-engineering">Computer Engineering</li>
          </ul>
          <input type="hidden" id="courseProgram" name="courseProgram" required>
        </div>
      </div>

   
      <div class="form-row form-row-year-section">

        <div class="form-field">
          <label for="yearLevelTrigger">Year Level</label>
          <div class="custom-select" id="yearLevelSelect" data-name="yearLevel">
            <button
              type="button"
              class="custom-select-trigger"
              id="yearLevelTrigger"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span class="custom-select-value" data-placeholder="Year">Year</span>
            </button>
            <ul class="custom-select-options" role="listbox" hidden>
              <li role="option" data-value="1">1st Year</li>
              <li role="option" data-value="2">2nd Year</li>
              <li role="option" data-value="3">3rd Year</li>
              <li role="option" data-value="4">4th Year</li>
              <li role="option" data-value="5">5th Year</li>
            </ul>
            <input type="hidden" id="yearLevel" name="yearLevel" required>
          </div>
        </div>

        <div class="form-field">
          <label for="sectionTrigger">Section</label>
          <div class="custom-select" id="sectionSelect" data-name="section">
            <button
              type="button"
              class="custom-select-trigger"
              id="sectionTrigger"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span class="custom-select-value" data-placeholder="Section">Section</span>
            </button>
            <ul class="custom-select-options" role="listbox" hidden>
              <li role="option" data-value="A">A</li>
              <li role="option" data-value="B">B</li>
              <li role="option" data-value="C">C</li>
              <li role="option" data-value="D">D</li>
            </ul>
            <input type="hidden" id="section" name="section" required>
          </div>
        </div>

      </div>

      <button type="submit" class="btn next-button" id="nextButton">
        Next <span aria-hidden="true">&rarr;</span>
      </button>

    </form>

  </main>

  <script src="js/create-student-account.js"></script>
</body>
</html>
