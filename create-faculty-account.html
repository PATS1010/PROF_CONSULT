<!DOCTYPE html>
<!-- Create faculty account page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof Consult | Create Faculty Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/create-faculty-account.css">
<script src="js/dark-theme.js" data-scope="public"></script>
<link rel="stylesheet" href="css/dark-theme.css">
</head>
<body>

  
  <div class="page-background" aria-hidden="true">
    <img src="images/coea.jpg" alt="" class="page-background-image">
    <div class="page-background-overlay"></div>
  </div>

  
  <a href="login.html" class="back-button" id="backButton" data-nav="back">
    <span aria-hidden="true">&larr;</span> Back
  </a>

  
  <main class="registration-card">

    <h1 class="format-text registration-title">Create Faculty Account</h1>

    <form class="registration-form" id="createFacultyAccountForm">

      <div class="form-field">
        <label for="facultyIdNumber">Faculty ID Number</label>
        <input
          type="text"
          id="facultyIdNumber"
          name="facultyIdNumber"
          class="form-input"
          placeholder="00-00000"
          inputmode="numeric"
          autocomplete="off"
          maxlength="8"
          required
        >
      </div>

      
      <div class="form-row form-row-name">

        <div class="form-field">
          <label for="firstName">First Name</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            class="form-input"
            autocomplete="given-name"
            required
          >
        </div>

        <div class="form-field">
          <label for="middleInitial">Middle Initial</label>
          <input
            type="text"
            id="middleInitial"
            name="middleInitial"
            class="form-input"
            autocomplete="additional-name"
            maxlength="1"
          >
        </div>

        <div class="form-field">
          <label for="lastName">Last Name</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            class="form-input"
            autocomplete="family-name"
            required
          >
        </div>

       
        <div class="form-field">
          <label for="suffixTrigger">Suffix</label>
          <div class="custom-select" id="suffixSelect" data-name="suffix">
            <button
              type="button"
              class="custom-select-trigger"
              id="suffixTrigger"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span class="custom-select-value" data-placeholder="Suffix">Suffix</span>
            </button>
            <ul class="custom-select-options" role="listbox" hidden>
              <li role="option" data-value="">None</li>
              <li role="option" data-value="Sr.">Sr.</li>
              <li role="option" data-value="Jr.">Jr.</li>
              <li role="option" data-value="I">I</li>
              <li role="option" data-value="II">II</li>
              <li role="option" data-value="III">III</li>
            </ul>
            <input type="hidden" id="suffix" name="suffix">
          </div>
        </div>

      </div>

      <div class="form-field">
        <label for="departmentTrigger">Department</label>
        <div class="custom-select" id="departmentSelect" data-name="department">
          <button
            type="button"
            class="custom-select-trigger"
            id="departmentTrigger"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="custom-select-value" data-placeholder="Select Department">Select Department</span>
          </button>
          <ul class="custom-select-options" role="listbox" hidden>
            <li role="option" data-value="computer-engineering">Computer Engineering</li>
            <li role="option" data-value="civil-engineering">Civil Engineering</li>
            <li role="option" data-value="electronics-engineering">Electronics Engineering</li>
          </ul>
          <input type="hidden" id="department" name="department" required>
        </div>
      </div>

      <button type="submit" class="btn next-button" id="nextButton">
        Next <span aria-hidden="true">&rarr;</span>
      </button>

    </form>

  </main>

  <script src="js/create-faculty-account.js"></script>
</body>
</html>
