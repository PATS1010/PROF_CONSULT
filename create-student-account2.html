<!DOCTYPE html>
<!-- Create student account page (Step 2). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prof Consult | Create Student Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/create-student-account2.css">
<script src="js/dark-theme.js" data-scope="public"></script>
<link rel="stylesheet" href="css/dark-theme.css">
</head>

<body>

 
  <div class="page-background" aria-hidden="true">

    <img
      src="images/coea.jpg"
      alt=""
      class="page-background-image"
    >

    <div class="page-background-overlay"></div>

  </div>


  <a
    href="create-student-account.html"
    class="back-button"
    id="backButton"
    data-nav="back"
  >
    <span aria-hidden="true">&larr;</span> Back
  </a>


  
  <main class="registration-card">

    <h1 class="format-text registration-title">
      Create Student Account
    </h1>


    <form
      class="registration-form"
      id="createStudentAccountStep2Form"
      novalidate
    >

    
      <div class="form-field">

        <label for="emailAddress">
          Email Address
        </label>

        <input
          type="email"
          id="emailAddress"
          name="emailAddress"
          class="form-input"
          placeholder="example@gmail.com"
          autocomplete="email"
          required
        >

        <p
          class="field-message field-message-error"
          id="emailError"
          hidden
        >
          Please enter a valid email address.
        </p>

      </div>


      <div class="form-field">

        <label for="mobileNumber">
          Mobile Number
        </label>

        <div class="mobile-input-group">

          <span
            class="mobile-prefix"
            aria-hidden="true"
          >
            +63
          </span>

          <input
            type="tel"
            id="mobileNumber"
            name="mobileNumber"
            class="form-input mobile-input"
            placeholder="912-345-6789"
            inputmode="numeric"
            autocomplete="off"
            maxlength="12"
            required
          >

        </div>

        <p
          class="field-message field-message-error"
          id="mobileError"
          hidden
        >
          Please enter a valid 10-digit mobile number.
        </p>

      </div>


    
      <div class="form-field">

        <label for="password">
          Password
        </label>

        <div class="password-input-group">

          <input
            type="password"
            id="password"
            name="password"
            class="form-input password-input"
            placeholder="Enter Password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            id="passwordToggle"
            aria-label="Show password"
            data-target="password"
          >
            Show
          </button>

        </div>

        <p
          class="field-message field-message-error"
          id="passwordFieldError"
          hidden
        ></p>

      
        <ul class="password-requirements">

          <li id="reqLength">&check; At least 8 characters</li>
          <li id="reqUppercase">&check; One uppercase letter</li>
          <li id="reqNumber">&check; One number</li>

        </ul>

      </div>


      
      <div class="form-field">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <div class="password-input-group">

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input password-input"
            placeholder="Confirm Password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            id="confirmPasswordToggle"
            aria-label="Show password"
            data-target="confirmPassword"
          >
            Show
          </button>

        </div>

        <p
          class="field-message field-message-error"
          id="passwordError"
          hidden
        >
          Password does not match.
        </p>

      </div>


    
      <label class="terms-checkbox">

        <input
          type="checkbox"
          id="agreeTerms"
          class="terms-checkbox-input"
          required
        >

        <span
          class="terms-checkbox-circle"
          aria-hidden="true"
        ></span>

        I agree to the Privacy Policy.

      </label>


    
      <a
        href="verify-account.html?from=student"
        class="btn verify-account-button"
      >
        Verify Account
      </a>


      
      <button
        type="submit"
        class="btn create-account-button"
        id="createAccountButton"
      >
        Create Student Account
      </button>



      <p
        class="field-message field-message-success"
        id="successMessage"
        hidden
      >
        Account successfully created.
      </p>


    
      <p
        class="field-message field-message-error"
        id="accountMessage"
        hidden
        aria-live="polite"
      ></p>


 
      <p class="login-text">

        Already have an account?

        <a
          href="login.html"
          class="login-link"
          data-nav="login"
        >
          Login
        </a>

      </p>

    </form>

  </main>


  <script src="js/create-student-account2.js"></script>

</body>
</html>
